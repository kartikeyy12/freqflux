name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: System packages (FFmpeg, audio decoding, software OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libegl1 libgl1 libgl1-mesa-dri libglx-mesa0

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: pytest -q
